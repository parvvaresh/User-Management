name: Performance Testing

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday at 3 AM
  workflow_dispatch:

jobs:
  load-test:
    name: Load Testing
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install psycopg2-binary locust

    - name: Set up test environment
      run: |
        echo "SECRET_KEY=test-secret-key-for-performance" > .env
        echo "DEBUG=False" >> .env
        echo "DATABASE_URL=postgres://test_user:test_password@localhost:5432/test_db" >> .env

    - name: Run migrations and setup
      run: |
        python manage.py migrate
        python manage.py collectstatic --noinput

    - name: Start Django server
      run: |
        python manage.py runserver 8000 &
        sleep 10
      env:
        DJANGO_SETTINGS_MODULE: project.settings

    - name: Create Locust test file
      run: |
        cat > locustfile.py << 'EOF'
        from locust import HttpUser, task, between
        
        class WebsiteUser(HttpUser):
            wait_time = between(1, 3)
            
            def on_start(self):
                # Login if needed
                pass
                
            @task(3)
            def view_auth_endpoints(self):
                self.client.get("/api/auth/login/")
                
            @task(1)
            def view_health_check(self):
                self.client.get("/api/auth/health/")
        EOF

    - name: Run load test
      run: |
        locust --host=http://localhost:8000 --users 10 --spawn-rate 2 --run-time 60s --headless --html=performance-report.html

    - name: Upload performance report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-report
        path: performance-report.html